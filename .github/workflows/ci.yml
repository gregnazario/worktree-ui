name: CI

on:
  push:
    # Pull requests provide feature-branch validation; retain push CI only for
    # the integration branch to avoid running the full matrix twice per commit.
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y build-essential g++
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Format check
        if: matrix.os == 'macos-15'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

  freebsd:
    name: freebsd-14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git rust libxcb libxkbcommon gcc
          run: |
            # ports install to /usr/local/lib, which base cc/ld and rtld
            # do not search by default on FreeBSD
            export LIBRARY_PATH=/usr/local/lib
            export LD_LIBRARY_PATH=/usr/local/lib
            cargo test
            cargo build --release

  docs:
    name: docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Local asset references exist
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          docs = pathlib.Path("docs")
          html = (docs / "index.html").read_text()
          refs = re.findall(r'(?:src|href)="([^"#][^"]*)"', html)
          missing = [
              r for r in refs
              if not r.startswith(("http://", "https://", "mailto:"))
              and not (docs / r).exists()
          ]
          if missing:
              sys.exit(f"docs/index.html references missing local files: {missing}")
          print(f"docs: {len(refs)} references OK")
          PY
