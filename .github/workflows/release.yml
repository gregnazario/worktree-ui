name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos-package:
    name: macOS universal package
    runs-on: macos-15
    permissions:
      contents: write # to create GitHub Releases on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Package .app (universal) and zip
        run: scripts/package-macos.sh "${VERSION#v}"
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktree-tool-macos-universal
          path: |
            dist/worktree-tool-*.dmg
            dist/worktree-tool-*.zip
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/worktree-tool-*.dmg dist/worktree-tool-*.zip \
            --title "worktree-tool $TAG" \
            --generate-notes \
            || gh release upload "$TAG" dist/worktree-tool-*.dmg dist/worktree-tool-*.zip --clobber
