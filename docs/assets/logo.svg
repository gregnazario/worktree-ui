<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- worktree-tool logo: a commit trunk forking into worktree branches.
       The forked node is the app's accent blue — the "selected worktree". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262637"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#bg)" stroke="#45475a" stroke-opacity="0.55" stroke-width="2"/>
  <g fill="none" stroke="#F05032" stroke-width="20" stroke-linecap="round">
    <!-- trunk + left branch -->
    <path d="M88 192 L88 64"/>
    <!-- right branch (the worktree) -->
    <path d="M88 128 C 144 128 176 112 176 64"/>
  </g>
  <!-- root commit -->
  <circle cx="88" cy="192" r="19" fill="#F05032"/>
  <!-- branch head -->
  <circle cx="88" cy="64" r="19" fill="#F05032"/>
  <!-- worktree head: selected-row blue with a soft focus ring -->
  <circle cx="176" cy="64" r="27" fill="none" stroke="#89b4fa" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="176" cy="64" r="19" fill="#89b4fa"/>
</svg>
